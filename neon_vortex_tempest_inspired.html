<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Vortex</title>
<style>
  :root{
    --bg:#02030a;
    --cyan:#5ffcff;
    --blue:#4b74ff;
    --magenta:#ff4fd8;
    --yellow:#ffe66d;
    --red:#ff4b5c;
    --green:#6dff9f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff;font-family:Consolas,Monaco,monospace}
  body{
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at center,#08142b 0,#02040b 46%,#000 80%);
  }
  #wrap{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    image-rendering:auto;
    touch-action:none;
  }
  #hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:14px;
    text-shadow:0 0 8px currentColor;
  }
  .topbar,.bottombar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .panel{
    padding:7px 10px;
    border:1px solid rgba(95,252,255,.5);
    background:rgba(0,8,20,.44);
    box-shadow:0 0 14px rgba(95,252,255,.15) inset,0 0 12px rgba(95,252,255,.12);
    backdrop-filter:blur(4px);
    border-radius:6px;
    font-size:clamp(12px,1.8vw,18px);
  }
  #centerMessage{
    position:absolute;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    width:min(90vw,760px);
    text-align:center;
    pointer-events:none;
    color:white;
    text-shadow:0 0 10px #fff,0 0 25px var(--cyan);
  }
  #title{
    font-size:clamp(34px,7vw,86px);
    font-weight:900;
    letter-spacing:.08em;
    color:var(--cyan);
    margin:0 0 8px;
  }
  #subtitle{
    font-size:clamp(14px,2.4vw,24px);
    line-height:1.45;
    color:#d9ffff;
  }
  #startButton{
    margin-top:22px;
    pointer-events:auto;
    border:1px solid var(--cyan);
    color:#001018;
    background:var(--cyan);
    box-shadow:0 0 18px rgba(95,252,255,.85);
    padding:12px 22px;
    font:700 18px Consolas,monospace;
    border-radius:6px;
    cursor:pointer;
  }
  #controls{
    position:absolute;
    inset:auto 0 14px 0;
    display:flex;
    justify-content:center;
    gap:14px;
    pointer-events:none;
  }
  .touchBtn{
    pointer-events:auto;
    width:64px;
    height:64px;
    border-radius:50%;
    border:1px solid rgba(95,252,255,.8);
    background:rgba(0,25,42,.56);
    color:#dfffff;
    box-shadow:0 0 12px rgba(95,252,255,.32) inset,0 0 12px rgba(95,252,255,.25);
    font:700 28px Consolas,monospace;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  #fireBtn{
    border-color:rgba(255,79,216,.9);
    box-shadow:0 0 12px rgba(255,79,216,.32) inset,0 0 12px rgba(255,79,216,.25);
  }
  #scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.045) 0px,
      rgba(255,255,255,.045) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode:screen;
  }
  #vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.95);
  }
  .hidden{display:none!important}
  @media (pointer:fine){
    #controls{opacity:.32}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="panel">SCORE <span id="score">000000</span></div>
      <div class="panel">LEVEL <span id="level">1</span></div>
      <div class="panel">LIVES <span id="lives">3</span></div>
    </div>
    <div class="bottombar">
      <div class="panel">MOVE A/D or ←/→ &nbsp; FIRE SPACE</div>
      <div class="panel">P PAUSE &nbsp; M SOUND</div>
    </div>
  </div>

  <div id="centerMessage">
    <div id="title">NEON VORTEX</div>
    <div id="subtitle">
      Race around the rim of a collapsing energy tunnel.<br>
      Destroy intruders before they reach the edge.
    </div>
    <button id="startButton">START GAME</button>
  </div>

  <div id="controls">
    <button class="touchBtn" id="leftBtn">◀</button>
    <button class="touchBtn" id="fireBtn">●</button>
    <button class="touchBtn" id="rightBtn">▶</button>
  </div>

  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const centerMessage = document.getElementById('centerMessage');
  const startButton = document.getElementById('startButton');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');

  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0, outerR = 0;
  let last = performance.now();

  const TAU = Math.PI * 2;
  const LANES = 16;
  const DEPTH_RINGS = 13;

  const state = {
    running:false,
    paused:false,
    gameOver:false,
    level:1,
    score:0,
    lives:3,
    lane:0,
    laneFloat:0,
    moveDir:0,
    firing:false,
    shotCooldown:0,
    invuln:0,
    levelTimer:0,
    spawnTimer:0,
    enemiesRemaining:14,
    sound:true,
    shake:0,
    tunnelSpin:0,
    flash:0
  };

  const bullets = [];
  const enemies = [];
  const particles = [];
  const sparks = [];
  const stars = [];
  const keys = {};

  let audioCtx = null;

  function initAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq=440, dur=.08, type='square', gain=.04, slide=0){
    if(!state.sound) return;
    initAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide), audioCtx.currentTime+dur);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime+dur);
  }

  function noiseBurst(dur=.15, gain=.05){
    if(!state.sound) return;
    initAudio();
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1-i/len);
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    src.buffer = buf;
    g.gain.value = gain;
    src.connect(g).connect(audioCtx.destination);
    src.start();
  }

  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2;
    cy = H/2;
    outerR = Math.min(W,H) * .39;
    makeStars();
  }
  addEventListener('resize', resize);

  function makeStars(){
    stars.length = 0;
    const n = Math.floor((W*H)/9000);
    for(let i=0;i<n;i++){
      stars.push({
        a:Math.random()*TAU,
        r:Math.random()*Math.max(W,H)*.7,
        z:Math.random(),
        s:.4+Math.random()*1.8
      });
    }
  }

  function resetGame(){
    state.running = true;
    state.paused = false;
    state.gameOver = false;
    state.level = 1;
    state.score = 0;
    state.lives = 3;
    state.lane = 0;
    state.laneFloat = 0;
    state.moveDir = 0;
    state.firing = false;
    state.shotCooldown = 0;
    state.invuln = 0;
    state.levelTimer = 0;
    state.spawnTimer = .5;
    state.enemiesRemaining = 14;
    state.shake = 0;
    state.tunnelSpin = 0;
    bullets.length = 0;
    enemies.length = 0;
    particles.length = 0;
    sparks.length = 0;
    updateHUD();
    centerMessage.classList.add('hidden');
    tone(220,.1,'sawtooth',.04,500);
  }

  function nextLevel(){
    state.level++;
    state.enemiesRemaining = 12 + state.level*3;
    state.spawnTimer = 1.2;
    state.levelTimer = 1.5;
    state.score += 1000 * state.level;
    state.flash = 1;
    updateHUD();
    tone(330,.12,'sine',.05,550);
    setTimeout(()=>tone(660,.14,'sine',.04,330),90);
  }

  function endGame(){
    state.running = false;
    state.gameOver = true;
    titleEl.textContent = 'GAME OVER';
    subtitleEl.innerHTML = `FINAL SCORE: ${String(state.score).padStart(6,'0')}<br>LEVEL REACHED: ${state.level}`;
    startButton.textContent = 'PLAY AGAIN';
    centerMessage.classList.remove('hidden');
    noiseBurst(.45,.09);
    tone(150,.5,'sawtooth',.06,-120);
  }

  function updateHUD(){
    scoreEl.textContent = String(Math.max(0,Math.floor(state.score))).padStart(6,'0');
    levelEl.textContent = state.level;
    livesEl.textContent = state.lives;
  }

  function laneAngle(lane){
    return (lane / LANES) * TAU - Math.PI/2 + state.tunnelSpin;
  }

  function project(lane, depth){
    const t = Math.max(0,Math.min(1,depth));
    const a = laneAngle(lane);
    const near = outerR;
    const far = outerR*.09;
    const r = far + (near-far) * Math.pow(t, .82);
    return {
      x:cx + Math.cos(a)*r,
      y:cy + Math.sin(a)*r*.78,
      r,
      a
    };
  }

  function spawnEnemy(){
    if(state.enemiesRemaining <= 0) return;
    state.enemiesRemaining--;
    const roll = Math.random();
    const type = roll < .58 ? 'crawler' : roll < .84 ? 'spinner' : 'splitter';
    let lane = Math.floor(Math.random()*LANES);
    if(Math.abs(shortLaneDist(lane,state.lane))<2) lane=(lane+3+Math.floor(Math.random()*7))%LANES;
    enemies.push({
      type,
      lane,
      depth:.04,
      speed:(.055 + state.level*.006) * (type==='spinner'?1.08:type==='splitter'?.82:1),
      hp:type==='splitter'?2:1,
      phase:Math.random()*TAU,
      dead:false,
      hit:.0
    });
  }

  function shortLaneDist(a,b){
    let d=(a-b)%LANES;
    if(d>LANES/2)d-=LANES;
    if(d<-LANES/2)d+=LANES;
    return d;
  }

  function shoot(){
    if(!state.running || state.paused || state.shotCooldown>0) return;
    bullets.push({lane:state.lane,depth:.92,speed:.85});
    state.shotCooldown=.13;
    tone(730,.055,'square',.035,-260);
    const p=project(state.lane,.95);
    for(let i=0;i<5;i++){
      sparks.push({x:p.x,y:p.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.18});
    }
  }

  function damagePlayer(enemy){
    if(state.invuln>0) return;
    state.lives--;
    state.invuln=2.2;
    state.shake=18;
    state.flash=.8;
    updateHUD();
    const p=project(state.lane,1);
    explode(p.x,p.y,'#ff4b5c',32);
    noiseBurst(.25,.08);
    tone(110,.35,'sawtooth',.07,-70);
    enemy.dead=true;
    if(state.lives<=0) endGame();
  }

  function destroyEnemy(e,bonus=0){
    if(e.dead)return;
    e.dead=true;
    const p=project(e.lane,e.depth);
    explode(p.x,p.y,e.type==='spinner'?'#ff4fd8':e.type==='splitter'?'#ffe66d':'#5ffcff',18);
    state.score += (e.type==='splitter'?250:e.type==='spinner'?175:100) + bonus;
    state.shake=Math.max(state.shake,5);
    updateHUD();
    tone(e.type==='splitter'?180:280,.08,'triangle',.05,220);
  }

  function explode(x,y,color,count=20){
    for(let i=0;i<count;i++){
      const a=Math.random()*TAU;
      const sp=35+Math.random()*190;
      particles.push({
        x,y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        life:.25+Math.random()*.55,
        max:.8,
        color,
        size:1+Math.random()*3
      });
    }
  }

  function update(dt){
    if(!state.running || state.paused) return;

    state.tunnelSpin += dt * (.01 + state.level*.0015);
    state.shotCooldown=Math.max(0,state.shotCooldown-dt);
    state.invuln=Math.max(0,state.invuln-dt);
    state.levelTimer=Math.max(0,state.levelTimer-dt);
    state.shake=Math.max(0,state.shake-dt*35);
    state.flash=Math.max(0,state.flash-dt*2.4);

    let dir=0;
    if(keys['ArrowLeft']||keys['KeyA']) dir=-1;
    if(keys['ArrowRight']||keys['KeyD']) dir=1;
    if(state.moveDir) dir=state.moveDir;
    if(dir){
      state.laneFloat += dir * dt * 7.6;
      const target = Math.round(state.laneFloat);
      if(target!==state.lane){
        state.lane=((target%LANES)+LANES)%LANES;
        tone(160,.025,'sine',.014,25);
      }
    } else {
      state.laneFloat = Math.round(state.laneFloat);
    }
    state.laneFloat=(state.laneFloat+LANES*1000)%LANES;
    state.lane=Math.round(state.laneFloat)%LANES;

    if(keys['Space']||state.firing) shoot();

    state.spawnTimer -= dt;
    const maxOnScreen=Math.min(3+Math.floor(state.level/2),8);
    if(state.spawnTimer<=0 && state.enemiesRemaining>0 && enemies.filter(e=>!e.dead).length<maxOnScreen){
      spawnEnemy();
      state.spawnTimer=Math.max(.25,1.05-state.level*.055) * (.7+Math.random()*.7);
    }

    for(const b of bullets){
      b.depth -= b.speed*dt;
      if(b.depth<0)b.dead=true;
    }

    for(const e of enemies){
      if(e.dead)continue;
      e.phase+=dt*4;
      e.hit=Math.max(0,e.hit-dt*5);
      if(e.type==='spinner' && Math.random()<dt*(.35+state.level*.02)){
        e.lane=(e.lane+(Math.random()<.5?-1:1)+LANES)%LANES;
      }
      e.depth += e.speed*dt;
      if(e.depth>=.96){
        damagePlayer(e);
      }
    }

    for(const b of bullets){
      if(b.dead)continue;
      for(const e of enemies){
        if(e.dead)continue;
        const ld=Math.abs(shortLaneDist(b.lane,e.lane));
        if(ld<.45 && Math.abs(b.depth-e.depth)<.055){
          b.dead=true;
          e.hp--;
          e.hit=1;
          if(e.hp<=0){
            if(e.type==='splitter' && e.depth<.72){
              for(const off of [-1,1]){
                enemies.push({
                  type:'crawler',
                  lane:(e.lane+off+LANES)%LANES,
                  depth:e.depth+.01,
                  speed:e.speed*1.45,
                  hp:1,phase:Math.random()*TAU,dead:false,hit:0
                });
              }
            }
            destroyEnemy(e,Math.floor((1-e.depth)*100));
          } else {
            tone(420,.05,'square',.025,-100);
          }
          break;
        }
      }
    }

    bullets.splice(0,bullets.length,...bullets.filter(b=>!b.dead));
    enemies.splice(0,enemies.length,...enemies.filter(e=>!e.dead && e.depth<1.2));

    if(state.enemiesRemaining===0 && enemies.length===0 && state.levelTimer<=0){
      nextLevel();
    }

    for(const p of particles){
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vx*=Math.pow(.06,dt);p.vy*=Math.pow(.06,dt);
      p.life-=dt;
    }
    particles.splice(0,particles.length,...particles.filter(p=>p.life>0));

    for(const s of sparks){
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    }
    sparks.splice(0,sparks.length,...sparks.filter(s=>s.life>0));
  }

  function glowStroke(color,width=1,blur=12){
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.shadowColor=color;
    ctx.shadowBlur=blur;
  }

  function drawStars(){
    ctx.save();
    ctx.translate(cx,cy);
    for(const st of stars){
      st.r += .14 + state.level*.01;
      if(st.r>Math.max(W,H)*.75)st.r=5;
      const x=Math.cos(st.a)*st.r;
      const y=Math.sin(st.a)*st.r;
      const alpha=.15+.6*(st.r/(Math.max(W,H)*.75));
      ctx.fillStyle=`rgba(180,235,255,${alpha})`;
      ctx.fillRect(x,y,st.s,st.s);
    }
    ctx.restore();
  }

  function drawTunnel(){
    ctx.save();
    ctx.translate(
      state.shake ? (Math.random()-.5)*state.shake : 0,
      state.shake ? (Math.random()-.5)*state.shake : 0
    );

    const colors=['#5ffcff','#4b74ff','#ff4fd8','#ffe66d'];
    for(let i=0;i<LANES;i++){
      const p1=project(i,1);
      const p2=project(i,.02);
      const color=colors[i%colors.length];
      glowStroke(color,1.15,8);
      ctx.globalAlpha=.62;
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.lineTo(p2.x,p2.y);
      ctx.stroke();
    }

    for(let r=0;r<DEPTH_RINGS;r++){
      const depth=r/(DEPTH_RINGS-1);
      ctx.beginPath();
      for(let i=0;i<=LANES;i++){
        const p=project(i%LANES,depth);
        if(i===0)ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      }
      const hue=185+depth*90;
      glowStroke(`hsla(${hue},100%,70%,${.18+.44*depth})`, depth>.8?1.4:.8, depth>.8?11:5);
      ctx.stroke();
    }

    // rim segments
    for(let i=0;i<LANES;i++){
      const a=project(i,1), b=project((i+1)%LANES,1);
      glowStroke(i===state.lane?'#ffffff':'#5ffcff',i===state.lane?4:2,i===state.lane?20:10);
      ctx.globalAlpha=i===state.lane?1:.78;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }

    ctx.restore();
    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
  }

  function drawPlayer(){
    if(!state.running && !state.gameOver)return;
    if(state.invuln>0 && Math.floor(state.invuln*10)%2===0)return;
    const p=project(state.lane,1.04);
    const a=p.a;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(a+Math.PI/2);
    ctx.strokeStyle='#ffffff';
    ctx.fillStyle='rgba(95,252,255,.24)';
    ctx.lineWidth=2;
    ctx.shadowColor='#5ffcff';
    ctx.shadowBlur=18;
    ctx.beginPath();
    ctx.moveTo(0,-18);
    ctx.lineTo(12,12);
    ctx.lineTo(0,7);
    ctx.lineTo(-12,12);
    ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.restore();
  }

  function drawBullets(){
    for(const b of bullets){
      const p=project(b.lane,b.depth);
      const tail=project(b.lane,Math.min(1,b.depth+.07));
      glowStroke('#ffffff',2.4,15);
      ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
  }

  function drawEnemy(e){
    const p=project(e.lane,e.depth);
    const scale=.35+e.depth*.95;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(scale,scale*.9);
    ctx.rotate(e.type==='spinner'?e.phase:0);
    const color=e.hit>0?'#ffffff':e.type==='spinner'?'#ff4fd8':e.type==='splitter'?'#ffe66d':'#5ffcff';
    ctx.strokeStyle=color;
    ctx.fillStyle=color+'22';
    ctx.lineWidth=2.2;
    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    if(e.type==='crawler'){
      ctx.beginPath();
      ctx.moveTo(0,-11);ctx.lineTo(10,0);ctx.lineTo(0,11);ctx.lineTo(-10,0);ctx.closePath();
      ctx.stroke();ctx.fill();
      ctx.beginPath();ctx.moveTo(-14,-9);ctx.lineTo(-5,0);ctx.lineTo(-14,9);
      ctx.moveTo(14,-9);ctx.lineTo(5,0);ctx.lineTo(14,9);ctx.stroke();
    } else if(e.type==='spinner'){
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=i*TAU/8;
        const rr=i%2?6:15;
        const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.stroke();ctx.fill();
      ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.stroke();
    } else {
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=-Math.PI/2+i*TAU/6;
        const x=Math.cos(a)*14,y=Math.sin(a)*14;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.stroke();ctx.fill();
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    ctx.save();
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=12;
      ctx.fillRect(p.x,p.y,p.size,p.size);
    }
    for(const s of sparks){
      ctx.globalAlpha=Math.max(0,s.life/.18);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(s.x,s.y,2,2);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawCenterCore(){
    const r=outerR*.085;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2);
    g.addColorStop(0,'rgba(255,255,255,.9)');
    g.addColorStop(.2,'rgba(95,252,255,.65)');
    g.addColorStop(1,'rgba(95,252,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(cx,cy,r*2,0,TAU);ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.65);
    bg.addColorStop(0,'#07172f');
    bg.addColorStop(.55,'#02040b');
    bg.addColorStop(1,'#000');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    drawStars();
    drawTunnel();
    drawCenterCore();
    drawBullets();
    for(const e of enemies)drawEnemy(e);
    drawPlayer();
    drawParticles();

    if(state.flash>0){
      ctx.fillStyle=`rgba(255,255,255,${state.flash*.12})`;
      ctx.fillRect(0,0,W,H);
    }

    if(state.paused){
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';
      ctx.textAlign='center';
      ctx.font='700 42px Consolas';
      ctx.shadowColor='#5ffcff';
      ctx.shadowBlur=18;
      ctx.fillText('PAUSED',cx,cy);
      ctx.shadowBlur=0;
    }
  }

  function loop(now){
    const dt=Math.min(.035,(now-last)/1000);
    last=now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if(e.code==='KeyP' && state.running){
      state.paused=!state.paused;
      tone(state.paused?180:420,.08,'sine',.03,100);
    }
    if(e.code==='KeyM') state.sound=!state.sound;
    if((e.code==='Enter'||e.code==='Space')&&!state.running){
      resetGame();
    }
  });
  addEventListener('keyup',e=>{keys[e.code]=false});

  function bindHold(el,onDown,onUp){
    const down=e=>{e.preventDefault();initAudio();onDown()};
    const up=e=>{e.preventDefault();onUp()};
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
    el.addEventListener('pointerleave',up);
  }
  bindHold(document.getElementById('leftBtn'),()=>state.moveDir=-1,()=>state.moveDir=0);
  bindHold(document.getElementById('rightBtn'),()=>state.moveDir=1,()=>state.moveDir=0);
  bindHold(document.getElementById('fireBtn'),()=>state.firing=true,()=>state.firing=false);

  canvas.addEventListener('pointerdown',e=>{
    if(!state.running)return;
    const x=e.clientX;
    if(x<W*.34)state.moveDir=-1;
    else if(x>W*.66)state.moveDir=1;
    else state.firing=true;
  });
  canvas.addEventListener('pointerup',()=>{
    state.moveDir=0;state.firing=false;
  });
  canvas.addEventListener('pointercancel',()=>{
    state.moveDir=0;state.firing=false;
  });

  startButton.addEventListener('click',()=>{
    initAudio();
    titleEl.textContent='NEON VORTEX';
    startButton.textContent='START GAME';
    resetGame();
  });

  resize();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
